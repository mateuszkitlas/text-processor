<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text processor</title>
  <style>
    * {
      border: 0;
      outline: 0;
      margin: 0;
      padding: 0;
      gap: 10px;
      font-size: 1rem;
    }

    body {
      display: flex;
      height: 100vh;
      box-sizing: content-box;
      background-color: #000;

      &>div,
      &>textarea {
        flex: 1;
        padding: 10px;
        color: #eee;
        background-color: #222;
      }

      @media(max-aspect-ratio: 4/3) {
        flex-direction: column;
      }

      &>div {
        &>div {
          display: flex;
          margin-bottom: 10px;

          &>* {
            flex: 1
          }
        }

        &>pre {
          white-space: break-spaces;
          overflow-wrap: anywhere;
          word-break: break-all;
        }
      }
    }
  </style>
</head>

<body>
  <textarea></textarea>
  <div>
    <div>
      <select>
        <option value="uaToPl">Cyrylica -> Łoźmiński</option>
        <option value="plToUa">Łoźmiński -> Cyrylica</option>
      </select>
      <button>copy</button>
    </div>
    <pre></pre>
  </div>
  <script>
    const $t = document.querySelector("textarea");
    const $pre = document.querySelector("pre");
    const $select = document.querySelector("select");
    const scoped = (f) => f();
    const cm = {
      ...(() => {
        // ---------- Mapping tables ----------
        const uaSingleToPl = new Map([
          ["А", "A"], ["а", "a"],
          ["Б", "B"], ["б", "b"],
          ["В", "W"], ["в", "w"],
          ["Г", "H"], ["г", "h"],
          ["Ґ", "G"], ["ґ", "g"],
          ["Д", "D"], ["д", "d"],
          ["Е", "E"], ["е", "e"],
          ["Ж", "Ż"], ["ж", "ż"],
          ["З", "Z"], ["з", "z"],
          ["И", "Y"], ["и", "y"],
          ["І", "I"], ["і", "i"],
          ["Й", "J"], ["й", "j"],
        ]);

        const plSingleToUa = new Map([
          ["A", "А"], ["a", "а"],
          ["B", "Б"], ["b", "б"],
          ["W", "В"], ["w", "в"],
          ["H", "Г"], ["h", "г"],
          ["G", "Ґ"], ["g", "ґ"],
          ["D", "Д"], ["d", "д"],
          ["E", "Е"], ["e", "е"],
          ["Z", "З"], ["z", "з"],
          ["Y", "И"], ["y", "и"],
          ["I", "І"], ["i", "і"],
          ["K", "К"], ["k", "к"],
          ["L", "Л"], ["l", "л"],
          ["Ł", "Л"], ["ł", "л"],
          ["M", "М"], ["m", "м"],
          ["N", "Н"], ["n", "н"],
          ["O", "О"], ["o", "о"],
          ["P", "П"], ["p", "п"],
          ["R", "Р"], ["r", "р"],
          ["S", "С"], ["s", "с"],
          ["T", "Т"], ["t", "т"],
          ["U", "У"], ["u", "у"],
          ["F", "Ф"], ["f", "ф"],
          ["C", "Ц"], ["c", "ц"],
          ["J", "Й"], ["j", "й"],
        ]);
        // ---------- Ukrainian → Polish ----------
        const uaToPl = str =>
          str
            .replace(/Дзь/g, "Dź").replace(/ДЗЬ/g, "DŹ").replace(/дзь/gi, "dź")

            .replace(/Ш[абвгґдезиікллмнопрстуфцйь]/g, "Sz").replace(/Ш/g, "SZ").replace(/ш/g, "sz")
            .replace(/Ч[абвгґдезиікллмнопрстуфцйь]/g, "Cz").replace(/Ч/g, "CZ").replace(/ч/g, "cz")
            .replace(/Щ[абвгґдезиікллмнопрстуфцйь]/g, "Szcz").replace(/Щ/g, "SZCZ").replace(/щ/g, "szcz")
            .replace(/Х[абвгґдезиікллмнопрстуфцйь]/g, "Ch").replace(/Х/g, "CH").replace(/х/gi, "ch")
            .replace(/Ю[абвгґдезиікллмнопрстуфцйь]/g, "Ju").replace(/Ю/g, "Ju").replace(/ю/gi, "ju")

            .replace(/Ц[Ьь]/g, "Ć").replace(/ць/gi, "ć")
            .replace(/З[Ьь]/g, "Ź").replace(/зь/gi, "ź")
            .replace(/С[Ьь]/g, "Ś").replace(/сь/gi, "ś")
            .replace(/Н[Ьь]/g, "Ń").replace(/нь/gi, "ń")
            .replace(/Л[Ьь]/g, "L").replace(/ль/gi, "l")
            .replace(/Т[Ьь]/g, "T'").replace(/ть/gi, "t'")
            .replace(/Д[Ьь]/g, "D'").replace(/дь/gi, "d'")

            .replace(/Ф/g, "F").replace(/ф/gi, "f")
            .replace(/У/g, "U").replace(/у/gi, "u")
            .replace(/Т/g, "T").replace(/т/gi, "t")
            .replace(/С/g, "S").replace(/с/gi, "s")
            .replace(/Р/g, "R").replace(/р/gi, "r")
            .replace(/П/g, "P").replace(/п/gi, "p")
            .replace(/О/g, "O").replace(/о/gi, "o")
            .replace(/Н/g, "N").replace(/н/gi, "n")
            .replace(/М/g, "M").replace(/м/gi, "m")
            .replace(/К/g, "K").replace(/к/gi, "k")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")
            .replace(//g, "").replace(//gi, "")


            .replace(/’/g, "")
            .split("")
            .map(ch => uaSingleToPl.get(ch) || ch)
            .join("");

        // ---------- Polish → Ukrainian ----------
        const plToUa = str =>
          str
            .replace(/Szcz/g, "Щ").replace(/szcz/gi, "щ")
            .replace(/Cz/g, "Ч").replace(/cz/gi, "ч")
            .replace(/Sz/g, "Ш").replace(/sz/gi, "ш")
            .replace(/Ch/g, "Х").replace(/ch/gi, "х")
            .replace(/Ż/g, "Ж").replace(/ż/gi, "ж")
            .replace(/Ź[abwhgdezyiklłmnoprstufcj]/g, "Зь").replace(/Ź/g, "ЗЬ").replace(/ź/gi, "зь")
            .replace(/Ś[abwhgdezyiklłmnoprstufcj]/g, "Сь").replace(/Ś/g, "СЬ").replace(/ś/gi, "сь")
            .replace(/Ć[abwhgdezyiklłmnoprstufcj]/g, "Ць").replace(/Ć/g, "ЦЬ").replace(/ć/gi, "ць")
            .replace(/Ń[abwhgdezyiklłmnoprstufcj]/g, "Нь").replace(/Ń/g, "НЬ").replace(/ń/gi, "нь")
            .replace(/DŹ/g, "ДЗЬ").replace(/Dź/g, "Дзь").replace(/dź/gi, "дзь")
            .replace(/T['’][abwhgdezyiklłmnoprstufcj]/g, "Ть").replace(/T['’]/g, "ТЬ").replace(/t['’]/gi, "ть")
            .replace(/D['’][abwhgdezyiklłmnoprstufcj]/g, "Дь").replace(/t['’]/g, "ДЬ").replace(/d['’]/gi, "дь")
            .replace(/J[aA]/g, "Я").replace(/ja/gi, "я")
            .replace(/J[eE]/g, "Є").replace(/je/gi, "є")
            .replace(/J[iI]/g, "Ї").replace(/ji/gi, "ї")
            .replace(/J[uU]/g, "Ю").replace(/ju/gi, "ю")
            .split("")
            .map(ch => plSingleToUa.get(ch) || ch)
            .join("");

        return { uaToPl, plToUa };
      })()
    }
    const convert = () => cm[$select.value]($t.value)
    const write = () => { $pre.innerText = convert() }
    $t.addEventListener("input", write);
    $select.addEventListener("change", write);
    write();
    document.querySelector("button").addEventListener("click", () => navigator.clipboard.writeText(convert()));
  </script>
</body>

</html>
